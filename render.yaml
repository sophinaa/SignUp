# Render Blueprint: https://render.com/docs/blueprint-spec
# In Render: New → Blueprint → pick this repo. You'll be asked for the values
# marked `sync: false`.
#
# Free plan: the site sleeps after 15 minutes without visitors and takes
# about a minute to wake. Render's free plan has no persistent disk, so RSVPs
# are stored in a free Turso database (see README).
services:
  - type: web
    name: shared-light-cafe
    runtime: node
    plan: free
    # --include=dev: the build step needs Vite/TypeScript even though
    # NODE_ENV is production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Random secret, generated once by Render. Don't change it later:
      # guests' manage links depend on it.
      - key: APP_SECRET
        generateValue: true
      # Your organiser password (12+ characters).
      - key: ORGANISER_PASSWORD
        sync: false
      # The site's address, e.g. https://shared-light-cafe.onrender.com
      - key: SITE_URL
        sync: false
      # From Turso: the database URL (libsql://…) and an auth token.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
